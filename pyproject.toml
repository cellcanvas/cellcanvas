[project]
name = "cellcanvas"
version = "0.1.0"
description = "CellCanvas integration workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
server = [
    "numpy>=2",
    "copick>=1.31,<2",
    "copick-server @ git+https://github.com/copick/copick-server@1d9b7666685d211d384617f7892aabe15929230d",
    "click>=8",
    "uvicorn>=0.30",
    "starlette>=0.40",
    "zarr>=2.18,<3",
    "pandas>=2",
    "scikit-image>=0.24",
]
client = [
    "napari>=0.9,<1",
    "PySide6>=6.7,<7",
    "copick>=1.31,<2",
    "zarr>=2.18,<3",
    "fsspec[http]",
    "requests>=2.31",
    "numpy>=2",
    "superqt>=0.7",
]
test = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
